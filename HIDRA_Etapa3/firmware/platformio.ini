[platformio]
src_dir = iot/src
include_dir = iot/include

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps = bblanchon/ArduinoJson@7.3.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:esp32-synthetic]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DHIDRA_SYNTHETIC_DEMO

[env:esp32-network-probe]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DHIDRA_NETWORK_PROBE

[env:esp32-integrated]
extends = env:esp32dev
board_build.partitions = default.csv
build_flags = ${env:esp32dev.build_flags} -DHIDRA_INTEGRATED_ORCHESTRATOR -DHIDRA_IOT_STUB=0
lib_deps =
    ${env:esp32dev.lib_deps}
    symlink://../../HIDRA_Etapa2
